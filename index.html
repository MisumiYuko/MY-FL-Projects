  td.plugs { color:var(--mut); font-size:13.5px; max-width:380px; line-height:1.45; }

<li><b>排序</b> —— 点击任意列标题；再次点击可反向排序。</li>
<li><b>重置</b> —— 一键清除所有筛选。</li>
<li><b>下载</b> —— <b>.flp</b> 是单独的工程文件（仅供预览）；<b>打包</b> 含采样，正式在 FL Studio 中打开请用它。</li>
</ul>
<p class="tip">示例：年份 <b>2024</b> + 制作时长 <b>≥ 5</b> + 搜索 <i>Serum</i> → 仅显示 2024 年、超过 5 小时且使用了 Serum 的工程。</p>`,
    count:(n,m)=>`显示 ${m} 个工程中的 ${n} 个`,
    foot:'提示：点击列标题可排序。单独的 .flp 仅供预览——正式使用请下载打包文件。© Misumi Yuko，CC BY 4.0。' },
};
let lang = (navigator.language||"en").toLowerCase().startsWith("zh") ? "zh" : "en";
let sortKey = "date", sortAsc = false;
const $ = id => document.getElementById(id);

function uniq(key){ return [...new Set(DATA.map(d=>d[key]).filter(Boolean))]; }

function fillSelects(){
  const t = I18N[lang];
  const ys = uniq("year").sort((a,b)=>b-a);
  $("year").innerHTML = `<option value="">${t.all}</option>` + ys.map(y=>`<option>${y}</option>`).join("");
  const cs = uniq("collection").sort();
  $("coll").innerHTML = `<option value="">${t.all}</option>` + cs.map(c=>`<option>${c}</option>`).join("");
}

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  $("t-title").textContent = t.title;
  $("t-sub").innerHTML = t.sub;
  $("l-q").textContent=t.q; $("q").placeholder=t.qph;
  $("l-year").textContent=t.year; $("l-coll").textContent=t.coll;
  $("l-from").textContent=t.from; $("l-to").textContent=t.to;
  $("l-hmin").textContent=t.hmin; $("l-hmax").textContent=t.hmax;
  $("reset").textContent=t.reset; $("lang").textContent=t.lang;
  $("foot").innerHTML=t.foot;
  $("help").textContent=t.helpBtn; $("help-h").textContent=t.helpTitle; $("help-body").innerHTML=t.help;
  const keys=["name","collection","date","modified","hours","bpm","plugins","desc","dl"];
  $("head").innerHTML = t.cols.map((c,i)=>{
    const k=keys[i]; const cls=(k===sortKey?"sorted "+(sortAsc?"asc":""):"");
    return `<th data-k="${k}" class="${cls}">${c}</th>`;
  }).join("");
  $("head").querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(k==="dl")return;
    if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k; sortAsc=true;}
    render();
  });
  const cur=$("coll").value, cy=$("year").value; fillSelects();
  $("coll").value=cur; $("year").value=cy;
}

function render(){
  const t=I18N[lang];
  const q=$("q").value.toLowerCase().trim();
  const yr=$("year").value, co=$("coll").value;
  const df=$("from").value, dt=$("to").value;
  const hmin=parseFloat($("hmin").value), hmax=parseFloat($("hmax").value);
  let out = DATA.filter(d=>{
    if(q && !(d.name.toLowerCase().includes(q)||d.plugins.toLowerCase().includes(q)||(d.desc||"").toLowerCase().includes(q))) return false;
    if(yr && d.year!==yr) return false;
    if(co && d.collection!==co) return false;
    if(df && d.date<df) return false;
    if(dt && d.date>dt) return false;
    if(!isNaN(hmin) && (d.hours==null || d.hours<hmin)) return false;
    if(!isNaN(hmax) && (d.hours==null || d.hours>hmax)) return false;
    return true;
  });
  out.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(sortKey==="hours"){ x=x==null?-1:x; y=y==null?-1:y; }
    if(sortKey==="bpm"){ x=parseFloat(x)||-1; y=parseFloat(y)||-1; }
    if(x<y) return sortAsc?-1:1; if(x>y) return sortAsc?1:-1; return 0;
  });
  $("count").textContent = t.count(out.length, DATA.length);
  $("head").querySelectorAll("th").forEach(th=>{
    th.classList.toggle("sorted", th.dataset.k===sortKey);
    th.classList.toggle("asc", th.dataset.k===sortKey && sortAsc);
  });
  $("rows").innerHTML = out.map(d=>`<tr>
    <td class="name">${esc(d.name)}</td>
    <td>${esc(d.collection)}</td>
    <td class="date">${d.date}</td>
    <td class="date">${d.modified||"—"}</td>
    <td class="num">${d.worked||"—"}</td>
    <td class="num">${d.bpm||"—"}</td>
    <td class="plugs">${esc(d.plugins)||"—"}</td>
    <td class="plugs">${esc(d.desc)||"—"}</td>
    <td class="dl"><a href="${d.flp}">${t.flp}</a> · <a class="bundle" href="${d.bundle}">${t.bundle}</a></td>
  </tr>`).join("");
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

["q","year","coll","from","to","hmin","hmax"].forEach(id=>$(id).addEventListener("input",render));
$("reset").onclick=()=>{ ["q","year","coll","from","to","hmin","hmax"].forEach(id=>$(id).value=""); render(); };
$("lang").onclick=()=>{ lang = lang==="en"?"zh":"en"; applyLang(); render(); };
$("help").onclick=()=>{ $("helpbg").hidden=false; };
$("helpx").onclick=()=>{ $("helpbg").hidden=true; };
$("helpbg").onclick=(e)=>{ if(e.target===$("helpbg")) $("helpbg").hidden=true; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("helpbg").hidden=true; });

applyLang(); render();
</script>
</body>
</html>
